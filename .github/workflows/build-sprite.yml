name: Build SVG Sprite

on:
  push:
    branches:
      - main
    paths:
      - "logos/**/*.svg"
      - "tools/build-sprite.py"
      - ".github/workflows/build-sprite.yml"
  workflow_dispatch:

concurrency:
  group: sprite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-sprite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build sprite
        run: python3 tools/build-sprite.py

      - name: Commit generated sprite
        run: |
          git add -A dist/
          if git diff --cached --quiet; then
            echo "✓ Sprite ist bereits aktuell."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "build: update SVG sprite"
          git push
